name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U app" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://app:app@localhost:5432/app_test
      TEST_DATABASE_URL: postgres://app:app@localhost:5432/app_test
      APP_ENCRYPTION_KEY: Y2ktb25seS1rZXktbm90LWEtc2VjcmV0LTEyMzQ1Njc4OTA=
      APP_BASE_URL: http://localhost:3100
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Dependency audit (production, high or critical)
        run: pnpm audit --prod --audit-level high
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm depcruise
      - name: Unit tests + coverage gate (domain ≥ 90 % lines)
        run: pnpm test:coverage
      - name: S3-compatible server for the object-storage tests (test credentials only)
        run: |
          docker run -d --name s3 --network host -v "$PWD/.github/s3:/cfg" chrislusf/seaweedfs \
            server -s3 -s3.port=9100 -s3.config=/cfg/s3.json -master.port=9333 -volume.port=8085 -filer.port=8889 -ip=127.0.0.1
          for i in $(seq 1 30); do docker exec s3 sh -c 'echo "s3.bucket.create -name tp-test" | weed shell -master=127.0.0.1:9333' && break; sleep 2; done
      - run: pnpm test:integration
        env:
          S3_TEST_ENDPOINT: http://127.0.0.1:9100
          S3_TEST_BUCKET: tp-test
          S3_TEST_ACCESS_KEY_ID: testkey
          S3_TEST_SECRET_ACCESS_KEY: testsecret123
      - name: Build
        run: pnpm build
      - name: Demo data
        run: |
          pnpm db:reset
          pnpm db:seed:demo
      - name: Security suite (RLS matrix on the demo data)
        run: pnpm test:security
      - name: Load data for performance (10 trainers, 1 000 clients)
        run: pnpm db:seed:perf
        env:
          PERF_PLANS: '100'
      - name: E2E (production build + demo data; includes the route cross-access matrix)
        run: |
          pnpm --filter @tp/web exec playwright install --with-deps chromium
          pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: apps/web/test-results
          retention-days: 7

  image:
    # The production image builds (Dockerfile, docs/OPERATIONS.md); it is not pushed anywhere.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build images (web, jobs)
        run: |
          docker build --target web -t training-platform:ci .
          docker build --target jobs -t training-platform-jobs:ci .
      # The image Render builds (render.yaml), started twice on an empty, non-superuser database.
      - name: Build the online deployment image and smoke-test it
        run: |
          docker build -f Dockerfile.render -t training-platform-render:ci .
          deploy/smoke-test.sh training-platform-render:ci
