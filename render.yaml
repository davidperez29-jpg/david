# Render Blueprint (docs/DEPLOY_RENDER.md): the whole platform online in the EU (Frankfurt)
# without any command. Render builds Dockerfile.render (web + jobs in one image), creates the
# PostgreSQL database and asks, in a form, for the first administrator's email and password.
# On every start the container migrates, loads the catalogues and creates that administrator if it
# does not exist yet (deploy/start.sh).
services:
  - type: web
    name: plataforma-entrenamiento
    runtime: docker
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    region: frankfurt
    # Free: for trying it (sleeps after 15 min idle). Starter: always on, for real use.
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: plataforma-db
          property: connectionString
      # Encrypts health text, phone numbers and 2FA secrets (base64, 256 bits, generated by Render).
      - key: APP_ENCRYPTION_KEY
        generateValue: true
      # First administrator, asked for in the Render form (never stored in the repository).
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        sync: false
      - key: ORG_NAME
        sync: false
      # "true" loads example clients (their users share the administrator's password).
      - key: DEMO_DATA
        value: 'false'
      # Daily jobs (alerts, retention) inside the app: no paid cron needed.
      - key: DAILY_JOBS
        value: in-app
      - key: LOG_LEVEL
        value: info

databases:
  - name: plataforma-db
    databaseName: plataforma
    region: frankfurt
    # Free databases expire after 30 days: switch to basic-256mb (or higher) for real use.
    plan: free
    postgresMajorVersion: '16'
    # Reachable only from the services of this account.
    ipAllowList: []
