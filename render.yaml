# Render Blueprint (docs/DEPLOY_RENDER.md): the whole platform online in the EU (Frankfurt), free
# and without an expiry date, without any command (restructure phase 22):
# - the web runs on Render's free plan, which does not expire (it sleeps after 15 min idle);
# - the database is a free Neon project in Frankfurt (Render's free database expires after 30
#   days); its connection string is asked for in the Blueprint form, like the administrator;
# - uploaded images are kept in that database: the free web has no persistent disk.
# Render builds Dockerfile.render (web + jobs in one image). The first start of each release
# migrates, loads the catalogues and creates the administrator; waking up again skips that
# (deploy/start.sh).
services:
  - type: web
    name: plataforma-entrenamiento
    runtime: docker
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    region: frankfurt
    # Free: does not expire; sleeps after 15 min idle and takes about a minute to wake up.
    plan: free
    healthCheckPath: /api/health
    # Free workspaces have 500 build minutes a month: changes to documentation and tests do not
    # rebuild the app.
    buildFilter:
      ignoredPaths:
        - docs/**
        - '**/*.md'
        - '**/test/**'
        - apps/web/e2e/**
    envVars:
      # Neon connection string (Neon → Connect), asked for in the Blueprint form. Copy it as Neon
      # shows it: the app handles channel_binding and the pooled host.
      - key: DATABASE_URL
        sync: false
      # Encrypts health text, phone numbers and 2FA secrets (base64, 256 bits, generated by Render).
      - key: APP_ENCRYPTION_KEY
        generateValue: true
      # First administrator, asked for in the Render form (never stored in the repository).
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        sync: false
      - key: ORG_NAME
        sync: false
      # Uploaded images in the database (the free web's disk is wiped on every restart).
      - key: FILE_STORAGE
        value: database
      # "true" loads example clients (their users share the administrator's password).
      - key: DEMO_DATA
        value: 'false'
      # Daily jobs (alerts, retention) inside the app: no paid cron needed.
      - key: DAILY_JOBS
        value: in-app
      - key: LOG_LEVEL
        value: info
